<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Etymograph — a 3D etymology explorer</title>
  <meta name="description" content="A 3D force-directed explorer of language influence and word etymologies, built on the droher/etymology-db Wiktionary dataset." />
  <script>
    // The influence gradient lines use the vendored standalone three.js, which
    // coexists with the copy bundled inside 3d-force-graph. That triggers a
    // harmless "Multiple instances of Three.js" console warning — filter only
    // that exact message so the console stays clean.
    (function () {
      const warn = console.warn;
      console.warn = function (msg) {
        if (typeof msg === "string" && msg.indexOf("Multiple instances of Three.js") >= 0) return;
        return warn.apply(console, arguments);
      };
    })();
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="graph"></div>

  <header id="panel">
    <div class="brand">
      <h1>Etymograph</h1>
      <span class="tag">3D etymology explorer</span>
    </div>

    <form id="search-form" autocomplete="off">
      <input id="search-input" type="search" placeholder="Search a word — try knife, water, mother" aria-label="Search a word" />
      <button id="search-btn" type="submit">Search</button>
      <button id="reset-btn" type="button" title="Back to the language-influence view">Reset</button>
    </form>

    <div class="controls">
      <select id="lang-filter" aria-label="Filter by language" hidden></select>
      <div class="seg" id="color-mode" role="group" aria-label="Color mode">
        <button data-mode="relation" class="active" type="button">Relation type</button>
        <button data-mode="family" type="button">Language family</button>
      </div>
    </div>

    <div id="legend" class="legend"></div>
    <div id="status" class="status"></div>
  </header>

  <footer id="credit">
    Data: <a href="https://github.com/droher/etymology-db" target="_blank" rel="noopener">droher/etymology-db</a>,
    derived from <a href="https://www.wiktionary.org/" target="_blank" rel="noopener">Wiktionary</a>,
    licensed <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>.
  </footer>

  <button id="align-btn" class="fab" type="button" title="Straighten — align the X-axis horizontal" aria-label="Straighten the X-axis">↔</button>
  <button id="reorient-btn" class="fab" type="button" title="Reset view (front, framed)" aria-label="Reset view">⌖</button>
  <button id="settings-toggle" class="fab" type="button" title="Layout settings" aria-label="Toggle layout settings">⚙</button>
  <aside id="settings-panel" class="settings" hidden>
    <h2>Layout settings</h2>
    <label class="set-row">
      <span>Circle radius <output id="out-radius"></output></span>
      <input type="range" id="set-radius" min="10" max="200" step="2" />
    </label>
    <label class="set-row">
      <span>Distance between circles <output id="out-dist"></output></span>
      <input type="range" id="set-dist" min="20" max="400" step="5" />
    </label>
    <label class="set-row">
      <span>Distance between levels <output id="out-level"></output></span>
      <input type="range" id="set-level" min="20" max="200" step="5" />
    </label>
    <label class="set-row">
      <span>Sphere size <output id="out-sphere"></output></span>
      <input type="range" id="set-sphere" min="1" max="14" step="0.5" />
    </label>
    <label class="set-row">
      <span>Max line thickness <output id="out-width"></output></span>
      <input type="range" id="set-width" min="1" max="20" step="0.5" />
    </label>
    <label class="set-row">
      <span>Panning sensitivity <output id="out-pan"></output></span>
      <input type="range" id="set-pan" min="0.02" max="1" step="0.02" />
    </label>
    <label class="set-row">
      <span>Relation colors</span>
      <select id="set-scheme" class="set-select">
        <option value="default">Default</option>
        <option value="neon">Neon</option>
        <option value="colorblind">Colorblind-friendly</option>
        <option value="grayscale">Grayscale</option>
        <option value="pastel">Pastel</option>
      </select>
    </label>
  </aside>

  <div id="tooltip" class="tooltip" hidden></div>

  <!-- Vendored runtime libraries (no CDN, no build step). Versions in README. -->
  <!-- three first so window.THREE is available for the influence gradient lines -->
  <script src="./lib/three.min.js"></script>
  <script src="./lib/3d-force-graph.min.js"></script>
  <script src="./lib/sqljs/sql-wasm.js"></script>
  <script src="./lib/fflate.min.js"></script>
  <script src="./main.js"></script>
</body>
</html>
